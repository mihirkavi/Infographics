<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pulse Markets banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=block" rel="stylesheet">
<style>
  /* Pulse Markets identity: the app's own slate + teal tokens (src/app/globals.css),
     a geometric display face, Inter body (the app's font) and tabular mono labels. */
  :root {
    --bg0: #f4f6f8; --bg1: #e8ecf1; --text: #0f172a; --muted: #475569; --soft: #64748b;
    --panel: #ffffff; --border: rgba(15,23,42,.10); --grid: rgba(15,23,42,.06);
    --accent: #0d9488; --accent-2: #0ea5e9; --pill-active: #0f766e; --pill-active-text: #f8fafc;
    --fill: #14b8a6; --shadow: 0 30px 70px rgba(15,23,42,.10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg0: #0b0f14; --bg1: #111827; --text: #e5e7eb; --muted: #9ca3af; --soft: #6b7280;
      --panel: #111827; --border: rgba(148,163,184,.16); --grid: rgba(148,163,184,.08);
      --accent: #2dd4bf; --accent-2: #38bdf8; --pill-active: #0f766e; --pill-active-text: #ecfdf5;
      --fill: #2dd4bf; --shadow: 0 30px 80px rgba(0,0,0,.5);
    }
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1600px; height: 600px; overflow: hidden; }
  body {
    font-family: Inter, sans-serif; color: var(--text);
    background:
      linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 100% 48px,
      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 48px 100%,
      radial-gradient(circle at 85% 30%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 520px),
      linear-gradient(160deg, var(--bg0), var(--bg1));
    display: grid; grid-template-columns: 700px 1fr; gap: 56px; align-items: center; padding: 0 88px;
  }
  .brand { display: flex; align-items: center; gap: 14px; font: 700 30px "Plus Jakarta Sans"; letter-spacing: -.02em; }
  .brand img { width: 52px; height: 52px; }
  .eyebrow { margin-top: 34px; font: 600 15px "JetBrains Mono"; letter-spacing: .14em; text-transform: uppercase; color: var(--soft); }
  .eyebrow b { color: var(--accent); font-weight: 600; }
  h1 { margin-top: 14px; font: 800 88px/0.98 "Plus Jakarta Sans"; letter-spacing: -.045em; }
  h1 span { background: linear-gradient(100deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { margin-top: 24px; font-size: 23px; line-height: 1.45; color: var(--muted); max-width: 620px; }

  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 22px; box-shadow: var(--shadow); padding: 26px 28px 22px; }
  .search { display: flex; align-items: center; gap: 12px; padding: 15px 18px; border: 1px solid var(--border); border-radius: 14px; font-size: 20px; color: var(--muted); }
  .search svg { flex: none; }
  .search .caret { width: 2px; height: 24px; background: var(--accent); margin-left: -6px; }
  .row { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  .tag { font: 600 13px "JetBrains Mono"; letter-spacing: .08em; text-transform: uppercase; padding: 7px 11px; border-radius: 8px; color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .ranges { display: flex; gap: 8px; margin-top: 18px; }
  .range { font: 500 15px "JetBrains Mono"; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
  .range.on { background: var(--pill-active); color: var(--pill-active-text); border-color: transparent; }
  .live { margin-left: auto; display: flex; align-items: center; gap: 8px; font: 500 15px "JetBrains Mono"; color: var(--soft); }
  .live i { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 20%, transparent); }
  svg.chart { display: block; margin-top: 14px; width: 100%; height: 170px; }
  .note { margin-top: 8px; font: 500 12px "JetBrains Mono"; color: var(--soft); letter-spacing: .04em; }
</style>
</head>
<body>
  <section>
    <div class="brand"><img src="../../../assets/brand/logo.png" alt="">Pulse Markets</div>
    <p class="eyebrow"><b>●</b> Open source · Next.js app · No API keys</p>
    <h1>Every market,<br><span>one search.</span></h1>
    <p class="sub">Type a name, pick a match, and get a live chart for stocks, ETFs, forex, futures or crypto.</p>
  </section>
  <section class="card">
    <div class="search">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      Apple, gold, EUR/USD, Bitcoin<span class="caret"></span>
    </div>
    <div class="row"><span class="tag">Stocks</span><span class="tag">ETFs</span><span class="tag">Forex</span><span class="tag">Futures</span><span class="tag">Crypto</span></div>
    <div class="ranges"><span class="range">1m</span><span class="range">5m</span><span class="range">15m</span><span class="range on">1h</span><span class="range">1d</span><span class="live"><i></i>live</span></div>
    <svg class="chart" viewBox="0 0 600 170" preserveAspectRatio="none">
      <defs>
        <linearGradient id="f" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--fill)" stop-opacity=".38"/><stop offset="1" stop-color="var(--fill)" stop-opacity="0"/></linearGradient>
        <linearGradient id="l" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="var(--accent)"/><stop offset="1" stop-color="var(--accent-2)"/></linearGradient>
      </defs>
      <g stroke="var(--grid)" stroke-width="1"><path d="M0 42H600M0 85H600M0 128H600"/></g>
      <path d="M0 110 L30 96 L55 104 L80 78 L105 88 L130 70 L150 92 L175 120 L200 98 L225 104 L250 72 L275 66 L300 80 L320 58 L345 76 L370 96 L395 84 L420 112 L445 90 L470 60 L495 72 L520 50 L545 64 L570 44 L600 52 L600 170 L0 170Z" fill="url(#f)"/>
      <path d="M0 110 L30 96 L55 104 L80 78 L105 88 L130 70 L150 92 L175 120 L200 98 L225 104 L250 72 L275 66 L300 80 L320 58 L345 76 L370 96 L395 84 L420 112 L445 90 L470 60 L495 72 L520 50 L545 64 L570 44 L600 52" fill="none" stroke="url(#l)" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="600" cy="52" r="5" fill="var(--accent-2)"/>
    </svg>
    <p class="note">Illustration · not market data</p>
  </section>
</body>
</html>
